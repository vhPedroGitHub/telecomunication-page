[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ltx"
version = "0.1.0"
description = "Líneas de transmisión: Γ, ROE, Zin, λ/4, stubs, Chebyshev/binomial/exponencial, guías de onda, microcinta y coplanar."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ltx = "ltx.__main__:main"

[tool.setuptools.packages.find]
include = ["ltx*"]
